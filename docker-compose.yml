version: "3.8"

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: sixense-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/sixense_dev_pw
      - NEO4J_PLUGINS=[]
      - NEO4J_dbms_memory_pagecache_size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - sixense_neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sixense-backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - SIXENSE_GRAPH_BACKEND=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sixense_dev_pw

volumes:
  sixense_neo4j_data:
